name: binkscrew
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^3.0.0
  video_player: ^2.8.6
  flutter_svg: ^2.0.9
  package_info_plus: ^8.0.0
  http: ^1.2.0
  image_picker: ^1.0.4
  share_plus: ^7.1.0
  shared_preferences: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/welcome.mp4
    - assets/logo.png
    - assets/hero.webp
    - assets/icon.png
    - assets/pokeball.svg
    - assets/anime.webp
    - assets/defaultpfp.webp

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
