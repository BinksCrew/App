name: Release and Update Version

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Bump Version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml
          $newContent = @()
          $bumped = $false
          foreach ($line in $content) {
              if (-not $bumped -and $line -match '^version: (\d+)\.(\d+)\.(\d+)(.*)') {
                  $major = $matches[1]
                  $minor = $matches[2]
                  $patch = [int]$matches[3] + 1
                  $suffix = $matches[4]
                  $newLine = "version: $major.$minor.$patch$suffix"
                  Write-Host "Bumping version to $major.$minor.$patch$suffix"
                  $newContent += $newLine
                  $bumped = $true
              } else {
                  $newContent += $line
              }
          }
          $newContent | Set-Content pubspec.yaml

      - name: Setup Keystore
        shell: pwsh
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $p = "android/key.properties"
          "storePassword=$env:ANDROID_STORE_PASSWORD" | Out-File -FilePath $p -Encoding ASCII
          "keyPassword=$env:ANDROID_KEY_PASSWORD" | Out-File -FilePath $p -Append -Encoding ASCII
          "keyAlias=upload" | Out-File -FilePath $p -Append -Encoding ASCII
          "storeFile=upload-keystore.jks" | Out-File -FilePath $p -Append -Encoding ASCII
          
          # Aggressively clean the base64 string: remove anything that isn't a valid base64 character
          $base64 = $env:ANDROID_KEYSTORE_BASE64 -replace '[^a-zA-Z0-9+/=]',''
          
          # Debug: Print length (safe to show in logs)
          Write-Host "Base64 string length: $($base64.Length)"
          
          if ($base64.Length -eq 0) {
            Write-Error "ANDROID_KEYSTORE_BASE64 secret is empty or invalid."
            exit 1
          }

          $bytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes("android/app/upload-keystore.jks", $bytes)

      - name: Run Release Script
        shell: pwsh
        run: ./release.ps1

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml version.json binkscrew.apk
          git commit -m "Bump version and update release artifacts [skip ci]"
          git push
